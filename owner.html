<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Farm Fresh Chicken Market - Owner
  </title>


  <style>

    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f5f5;

      color: #222;
    }


    header {

      background: #111;

      color: white;

      padding: 18px;

      text-align: center;
    }


    header h1 {

      margin: 0;

      font-size: 25px;
    }


    header p {

      margin: 8px 0 0;
    }


    .container {

      max-width: 750px;

      margin: 25px auto;

      padding: 15px;
    }


    .box {

      background: white;

      padding: 20px;

      border-radius: 12px;

      margin-bottom: 20px;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,.1);
    }


    input {

      width: 100%;

      padding: 13px;

      margin: 8px 0;

      border: 1px solid #ccc;

      border-radius: 8px;

      box-sizing: border-box;

      font-size: 15px;
    }


    button {

      border: none;

      padding: 12px 18px;

      border-radius: 8px;

      cursor: pointer;

      font-weight: bold;

      margin: 5px 3px;

      font-size: 14px;
    }


    .login-btn {

      width: 100%;

      background: #111;

      color: white;

      font-size: 16px;
    }


    .sound-btn {

      background: #ff6d00;

      color: white;

      font-size: 17px;

      width: 100%;

      padding: 15px;
    }


    .sound-on {

      background: #2e7d32;
    }


    .logout-btn {

      background: #d32f2f;

      color: white;
    }


    .done-btn {

      background: #2e7d32;

      color: white;
    }


    .order {

      border: 1px solid #ddd;

      border-radius: 10px;

      padding: 15px;

      margin-top: 15px;

      background: white;
    }


    .new-order {

      border: 3px solid #ff6d00;

      box-shadow:
        0 0 20px
        rgba(255,109,0,.4);

      animation:
        pulse 1s infinite;
    }


    @keyframes pulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.015);
      }

      100% {
        transform: scale(1);
      }
    }


    .status {

      font-weight: bold;

      color: #e65100;
    }


    .map-btn {

      background: #1976d2;

      color: white;
    }


    .call-btn {

      background: #00897b;

      color: white;
    }


    #dashboard {

      display: none;
    }


    #message {

      color: #d32f2f;

      margin-top: 10px;
    }


    .empty {

      text-align: center;

      color: #777;
    }


    .item {

      background: #f7f7f7;

      padding: 12px;

      margin: 7px 0;

      border-radius: 8px;

      border-left: 5px solid #ff6d00;
    }


    .new-badge {

      display: inline-block;

      background: #ff6d00;

      color: white;

      padding: 5px 10px;

      border-radius: 20px;

      font-size: 12px;

      font-weight: bold;

      margin-left: 5px;
    }


    .sound-status {

      font-weight: bold;

      font-size: 16px;
    }


    .order-time {

      color: #777;

      font-size: 13px;
    }


    .delivery-box {

      background: #e8f5e9;

      border-left: 5px solid #2e7d32;

      padding: 13px;

      border-radius: 7px;

      margin-top: 15px;

      line-height: 1.6;
    }


    .address {

      white-space: pre-wrap;

      background: #f7f7f7;

      padding: 12px;

      border-radius: 8px;
    }

  </style>

</head>


<body>


<header>

  <h1>
    🐔 Farm Fresh Chicken Market
  </h1>

  <p>
    Owner Delivery Dashboard
  </p>

</header>


<div class="container">


  <!-- LOGIN -->

  <div
    id="loginBox"
    class="box"
  >

    <h2>
      🔐 Owner Login
    </h2>


    <input
      type="email"
      id="email"
      placeholder="Owner Email"
    >


    <input
      type="password"
      id="password"
      placeholder="Password"
    >


    <button
      class="login-btn"
      onclick="login()"
    >
      Login
    </button>


    <p id="message"></p>

  </div>



  <!-- DASHBOARD -->

  <div id="dashboard">


    <div class="box">

      <h2>
        📦 Delivery Orders
      </h2>


      <button
        id="soundButton"
        class="sound-btn"
        onclick="enableSound()"
      >
        🔊 ENABLE LOUD ORDER ALARM
      </button>


      <button
        class="logout-btn"
        onclick="logout()"
      >
        Logout
      </button>


      <p
        id="soundStatus"
        class="sound-status"
      >
        🔕 Alarm is OFF
      </p>


      <p>
        Tap the alarm button once to test it.
      </p>

    </div>


    <div id="orders">

      <p class="empty">
        Waiting for orders...
      </p>

    </div>

  </div>

</div>


<script type="module">


  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


  import {
    getDatabase,
    ref,
    get,
    onChildAdded,
    update
  } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


  /* FIREBASE */

  const firebaseConfig = {

    apiKey:
      "AIzaSyCcKIDaVUTCzin0tP6oN16ABrexjGOS50M",

    authDomain:
      "farm-fresh-chicken-market.firebaseapp.com",

    databaseURL:
      "https://farm-fresh-chicken-market-default-rtdb.firebaseio.com",

    projectId:
      "farm-fresh-chicken-market",

    storageBucket:
      "farm-fresh-chicken-market.firebasestorage.app",

    messagingSenderId:
      "184530252526",

    appId:
      "1:184530252526:web:f7427c6a46eb76201df9ff"
  };


  const app =
    initializeApp(firebaseConfig);


  const db =
    getDatabase(app);


  const auth =
    getAuth(app);


  let soundEnabled = false;

  let audioContext = null;

  let existingOrderIds =
    new Set();

  let listenerStarted = false;



  /* LOGIN */

  window.login =
    async function() {

      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const message =
        document
          .getElementById("message");


      if (!email || !password) {

        message.textContent =
          "Please enter email and password.";

        return;
      }


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        message.textContent = "";

      } catch (error) {

        console.error(error);

        message.textContent =
          "Login failed. Check email/password.";
      }
    };



  /* AUTH */

  onAuthStateChanged(
    auth,
    async user => {

      if (user) {

        document
          .getElementById("loginBox")
          .style.display = "none";


        document
          .getElementById("dashboard")
          .style.display = "block";


        await loadOrders();

      } else {

        document
          .getElementById("loginBox")
          .style.display = "block";


        document
          .getElementById("dashboard")
          .style.display = "none";
      }
    }
  );



  /* SOUND */

  window.enableSound =
    async function() {

      try {

        if (!audioContext) {

          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();
        }


        if (
          audioContext.state ===
          "suspended"
        ) {

          await audioContext.resume();
        }


        soundEnabled = true;


        document
          .getElementById("soundStatus")
          .textContent =
          "🔊 LOUD ORDER ALARM IS ON";


        document
          .getElementById("soundButton")
          .textContent =
          "🔊 ALARM ENABLED";


        document
          .getElementById("soundButton")
          .classList
          .add("sound-on");


        playOrderSound();

      } catch (error) {

        console.error(error);
      }
    };



  function playBeep() {

    if (
      !soundEnabled ||
      !audioContext
    ) {
      return;
    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();
    }


    const now =
      audioContext.currentTime;


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.type =
      "sawtooth";


    oscillator.frequency.setValueAtTime(
      1200,
      now
    );


    oscillator.frequency.setValueAtTime(
      1000,
      now + 0.8
    );


    gain.gain.setValueAtTime(
      1.0,
      now
    );


    gain.gain.setValueAtTime(
      1.0,
      now + 0.8
    );


    gain.gain.exponentialRampToValueAtTime(
      0.01,
      now + 1.2
    );


    oscillator.start(now);

    oscillator.stop(
      now + 1.2
    );
  }



  function playOrderSound() {

    if (!soundEnabled)
      return;


    playBeep();


    setTimeout(
      () => playBeep(),
      1400
    );


    setTimeout(
      () => playBeep(),
      2800
    );


    setTimeout(
      () => playBeep(),
      4200
    );


    setTimeout(
      () => playBeep(),
      5600
    );
  }



  /* LOAD ORDERS */

  async function loadOrders() {

    if (listenerStarted)
      return;


    listenerStarted = true;


    const ordersRef =
      ref(db, "orders");


    try {

      const snapshot =
        await get(ordersRef);


      existingOrderIds.clear();


      snapshot.forEach(child => {

        existingOrderIds.add(
          child.key
        );

        displayOrder(
          child.key,
          child.val()
        );
      });


      onChildAdded(
        ordersRef,
        childSnapshot => {

          const orderId =
            childSnapshot.key;


          const order =
            childSnapshot.val();


          if (
            existingOrderIds.has(
              orderId
            )
          ) {
            return;
          }


          displayOrder(
            orderId,
            order
          );


          const status =
            String(
              order.status || "new"
            ).toLowerCase();


          if (status === "new") {

            playOrderSound();

            showNotification(
              order
            );
          }
        }
      );

    } catch (error) {

      console.error(error);

      document
        .getElementById("orders")
        .innerHTML =
        "<p class='empty'>" +
        "Could not load orders." +
        "</p>";
    }
  }



  /* DISPLAY ORDER */

  function displayOrder(
    id,
    order
  ) {

    const container =
      document.getElementById(
        "orders"
      );


    const empty =
      container.querySelector(
        ".empty"
      );


    if (empty)
      empty.remove();


    const div =
      document.createElement(
        "div"
      );


    const status =
      String(
        order.status || "new"
      ).toLowerCase();


    div.className =
      "order " +
      (
        status === "new"
        ? "new-order"
        : ""
      );


    const name =
      escapeHTML(
        order.name || ""
      );


    const phone =
      escapeHTML(
        order.phone || ""
      );


    const address =
      escapeHTML(
        order.deliveryAddress ||
        "Not provided"
      );


    const landmark =
      escapeHTML(
        order.landmark ||
        "Not provided"
      );


    const distance =
      order.distance ??
      order.distanceFromShop;


    let distanceText =
      "N/A";


    if (
      distance !== undefined &&
      distance !== null
    ) {

      distanceText =
        Number(distance).toFixed(2) +
        " km";
    }


    let timeText = "";


    if (order.createdAt) {

      try {

        timeText =
          new Date(
            order.createdAt
          ).toLocaleString();

      } catch (e) {}
    }



    /* PRODUCTS */

    let productsHTML = "";


    if (
      Array.isArray(order.items) &&
      order.items.length > 0
    ) {

      productsHTML =
        order.items.map(item => {

          const product =
            escapeHTML(
              item.product || ""
            );


          const quantity =
            escapeHTML(
              String(
                item.quantity || ""
              )
            );


          const price =
            Number(
              item.price || 0
            );


          return `

            <div class="item">

              🐔

              <strong>
                ${product}
              </strong>

              —

              ${quantity}

              ${
                price > 0
                ? " kg"
                : ""
              }

              ${
                price > 0
                ? `<br><small>₹${price}/kg</small>`
                : `<br><small>Price at shop</small>`
              }

            </div>
          `;

        }).join("");


    } else {

      productsHTML = `

        <div class="item">

          🐔

          <strong>
            ${escapeHTML(
              order.product || ""
            )}
          </strong>

          —

          ${escapeHTML(
            String(
              order.quantity ||
              order.qty ||
              ""
            )
          )}

        </div>
      `;
    }



    /* CUSTOMER MAP */

    let mapButton = "";


    if (
      order.customerMapLink
    ) {

      mapButton = `

        <button
          class="map-btn"
          onclick="openMap(
            '${escapeHTML(
              order.customerMapLink
            )}'
          )"
        >
          📍 Open Customer GPS
        </button>

      `;

    } else if (
      order.customerLatitude &&
      order.customerLongitude
    ) {

      const mapLink =
        `https://www.google.com/maps?q=${
          order.customerLatitude
        },${
          order.customerLongitude
        }`;


      mapButton = `

        <button
          class="map-btn"
          onclick="openMap(
            '${mapLink}'
          )"
        >
          📍 Open Customer GPS
        </button>

      `;
    }



    /* ORDER HTML */

    div.innerHTML = `

      <h3>

        🐔 Delivery Order

        ${
          status === "new"
          ? `
            <span class="new-badge">
              NEW
            </span>
          `
          : ""
        }

      </h3>


      ${
        timeText
        ? `
          <p class="order-time">
            🕒 ${escapeHTML(timeText)}
          </p>
        `
        : ""
      }


      <p>
        <strong>
          👤 Customer:
        </strong>

        ${name}
      </p>


      <p>
        <strong>
          📞 Phone:
        </strong>

        ${phone}
      </p>


      <p>
        <strong>
          🛒 Products:
        </strong>
      </p>


      ${productsHTML}


      <div class="delivery-box">

        <strong>
          🚚 DELIVERY DETAILS
        </strong>


        <p>
          <strong>
            🏠 Address:
          </strong>
        </p>


        <div class="address">
          ${address}
        </div>


        <p>
          <strong>
            📌 Landmark:
          </strong>

          ${landmark}
        </p>


        <p>
          <strong>
            📏 Distance:
          </strong>

          ${distanceText}
        </p>

      </div>


      <p class="status">

        Status:
        ${status.toUpperCase()}

      </p>


      ${
        status === "new"
        ? `
          <button
            class="done-btn"
            onclick="markDone('${id}')"
          >
            ✅ Mark Delivered / Done
          </button>
        `
        : ""
      }


      <button
        class="call-btn"
        onclick="callCustomer('${phone}')"
      >
        📞 Call Customer
      </button>


      ${mapButton}

    `;


    container.prepend(div);
  }



  /* CALL */

  window.callCustomer =
    function(phone) {

      window.location.href =
        "tel:" + phone;
    };



  /* MAP */

  window.openMap =
    function(link) {

      window.open(
        link,
        "_blank"
      );
    };



  /* MARK DONE */

  window.markDone =
    async function(id) {

      try {

        await update(
          ref(
            db,
            "orders/" + id
          ),
          {
            status: "done"
          }
        );


        alert(
          "Order marked as delivered ✅"
        );


        location.reload();

      } catch (error) {

        console.error(error);

        alert(
          "Could not update order."
        );
      }
    };



  /* NOTIFICATION */

  async function showNotification(
    order
  ) {

    if (
      !("Notification" in window)
    ) {
      return;
    }


    try {

      if (
        Notification.permission ===
        "default"
      ) {

        await Notification.requestPermission();
      }


      if (
        Notification.permission ===
        "granted"
      ) {

        let products = "";


        if (
          Array.isArray(order.items)
        ) {

          products =
            order.items
              .map(
                item =>
                  `${item.product} × ${item.quantity}`
              )
              .join(", ");

        } else {

          products =
            order.product ||
            "Chicken";
        }


        new Notification(
          "🐔 NEW DELIVERY ORDER!",
          {

            body:
              `${order.name || "Customer"} ordered ${products}`

          }
        );
      }

    } catch (error) {

      console.error(error);
    }
  }



  /* LOGOUT */

  window.logout =
    async function() {

      await signOut(auth);

    };



  /* ESCAPE HTML */

  function escapeHTML(value) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );
  }

</script>

</body>
</html>
