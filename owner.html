<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Farm Fresh Chicken Market - Owner</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#222;
  color:white;
  padding:20px 15px;
  text-align:center;
}

header h2{
  margin:5px 0;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:15px;
  box-shadow:0 2px 10px #ddd;
}

input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

button,
.btn{
  padding:11px 15px;
  border:0;
  border-radius:8px;
  background:#d43d16;
  color:white;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  margin:4px;
}

.logout{
  background:#555;
}

.accept{
  background:#168a35;
}

.reject{
  background:#d62828;
}

.delivery{
  background:#e67e22;
}

.delivered{
  background:#1769aa;
}

.track{
  background:#7b1fa2;
}

.hidden{
  display:none;
}

.order{
  background:white;
  border:2px solid #eee;
  border-radius:12px;
  padding:15px;
  margin:15px 0;
}

.order h3{
  margin-top:0;
}

.product{
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.product:last-child{
  border-bottom:0;
}

.status{
  font-weight:bold;
  padding:8px 0;
}

.new{
  color:#d43d16;
}

.accepted{
  color:#168a35;
}

.out-for-delivery{
  color:#e67e22;
}

.rejected{
  color:#d62828;
}

.delivered-status{
  color:#1769aa;
}

.small{
  font-size:13px;
  color:#666;
}

.sound-box{
  background:#fff7e6;
  border-radius:10px;
  padding:12px;
  margin-top:10px;
}

#soundStatus{
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

.tracking-box{
  background:#f3e8ff;
  border-radius:10px;
  padding:12px;
  margin:10px 0;
}

.direct-order{
  border:3px solid #ff9800 !important;
  box-shadow:
    0 0 0 4px rgba(255,152,0,.18),
    0 10px 30px rgba(0,0,0,.18) !important;
}

.direct-order-title{
  background:#fff3cd;
  color:#8a5a00;
  padding:10px 14px;
  border-radius:10px;
  margin-bottom:12px;
  font-weight:700;
}

.location-sharing{
  background:#e8f7e8;
  color:#168316;
  padding:10px;
  border-radius:10px;
  margin:10px 0;
  font-weight:bold;
}

.error-box{
  background:#ffecec;
  border:2px solid #d62828;
  color:#8b0000;
  padding:15px;
  border-radius:12px;
  margin:15px 0;
  word-break:break-word;
}

.success-box{
  background:#e8f7e8;
  border:2px solid #168a35;
  color:#166534;
  padding:15px;
  border-radius:12px;
  margin:15px 0;
}

</style>

</head>

<body>

<header>

<h2>🍗 Farm Fresh Chicken Market</h2>

<p>Owner Order Dashboard</p>

</header>


<div class="container">


<!-- LOGIN -->

<div
  class="card"
  id="loginBox"
>

<h2>🔐 Owner Login</h2>

<input
  type="email"
  id="email"
  placeholder="Owner Email"
>

<input
  type="password"
  id="password"
  placeholder="Password"
>

<button onclick="login()">
Login
</button>

<p id="loginStatus"></p>

</div>


<!-- DASHBOARD -->

<div
  id="dashboard"
  class="hidden"
>


<div class="card">

<h2>📦 Orders</h2>

<div class="sound-box">

<button onclick="enableSound()">
🔊 Enable Order Sound
</button>

<p id="soundStatus">
🔕 Order sound is not enabled.
</p>

</div>

<button
  class="logout"
  onclick="logout()"
>
Logout
</button>

</div>


<div id="orders">

<p class="empty">
Loading orders...
</p>

</div>


</div>

</div>


<script type="module">
  /* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getDatabase,
  ref,
  onValue,
  get,
  update
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut,
  setPersistence,
  browserLocalPersistence
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyCcKIDaVUTCzin0tP6oN16ABrexjGOS50M",

  authDomain:
  "farm-fresh-chicken-market.firebaseapp.com",

  databaseURL:
  "https://farm-fresh-chicken-market-default-rtdb.firebaseio.com",

  projectId:
  "farm-fresh-chicken-market",

  storageBucket:
  "farm-fresh-chicken-market.firebasestorage.app",

  messagingSenderId:
  "184530252526",

  appId:
  "1:184530252526:web:f7427c6a46eb76201df9ff"

};


const app =
initializeApp(firebaseConfig);


const db =
getDatabase(app);


const auth =
getAuth(app);


setPersistence(
  auth,
  browserLocalPersistence
).catch(error => {

  console.error(
    "Auth persistence error:",
    error
  );

});


/* =====================================================
   VARIABLES
===================================================== */

let firstLoad = true;

let knownOrderIds =
new Set();

let deliveryWatchId = null;

let activeDeliveryOrderId = null;

let ordersListenerStarted = false;

const requestedOrderId =
new URLSearchParams(
  window.location.search
).get("order");


/* =====================================================
   LOGIN
===================================================== */

window.login = async function(){

  const email =
    document
    .getElementById("email")
    .value
    .trim();


  const password =
    document
    .getElementById("password")
    .value;


  if(!email || !password){

    document
    .getElementById("loginStatus")
    .innerText =
    "❌ Enter email and password.";

    return;

  }


  document
  .getElementById("loginStatus")
  .innerText =
  "🔐 Signing in...";


  try{

    const credential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    /*
      Force Firebase to refresh the
      authentication token.
    */

    await credential.user.getIdToken(
      true
    );


    document
    .getElementById("loginStatus")
    .innerText =
    "✅ Login successful.";

  }

  catch(error){

    console.error(
      "Owner login error:",
      error
    );


    let message =
      "❌ Login failed.";


    if(
      error.code ===
      "auth/invalid-credential" ||

      error.code ===
      "auth/wrong-password" ||

      error.code ===
      "auth/user-not-found"
    ){

      message =
      "❌ Email or password is incorrect.";

    }

    else if(
      error.code ===
      "auth/invalid-email"
    ){

      message =
      "❌ Please enter a valid owner email address.";

    }

    else if(
      error.code ===
      "auth/too-many-requests"
    ){

      message =
      "⚠️ Too many login attempts. Please wait.";

    }

    else if(
      error.code ===
      "auth/operation-not-allowed"
    ){

      message =
      "❌ Firebase Email/Password sign-in is not enabled.";

    }

    else if(
      error.code ===
      "auth/network-request-failed"
    ){

      message =
      "❌ Network error. Check your internet.";

    }

    else{

      message =
      "❌ Login failed: " +
      (
        error.message ||
        error.code ||
        "Unknown error"
      );

    }


    document
    .getElementById("loginStatus")
    .innerText =
    message;

  }

};


/* =====================================================
   ENTER KEY LOGIN
===================================================== */

document
.getElementById("password")
.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){

      window.login();

    }

  }
);


/* =====================================================
   LOGOUT
===================================================== */

window.logout = async function(){

  try{

    if(
      deliveryWatchId !== null
    ){

      navigator.geolocation
      .clearWatch(
        deliveryWatchId
      );

      deliveryWatchId =
      null;

    }


    activeDeliveryOrderId =
    null;


    localStorage.removeItem(
      "farmFreshActiveDeliveryOrder"
    );


    await signOut(auth);

  }

  catch(error){

    console.error(
      "Logout error:",
      error
    );

  }

};


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(user){

      console.log(
        "Authenticated owner:",
        user.email,
        user.uid
      );


      try{

        /*
          Refresh Firebase authentication
          token before reading orders.
        */

        await user.getIdToken(
          true
        );


        console.log(
          "Firebase authentication token refreshed."
        );


        document
        .getElementById("loginBox")
        .classList
        .add("hidden");


        document
        .getElementById("dashboard")
        .classList
        .remove("hidden");


        await loadOrders();


        resumeActiveDelivery();

      }

      catch(error){

        console.error(
          "Authentication initialization error:",
          error
        );


        showDatabaseError(
          error
        );

      }

    }

    else{

      document
      .getElementById("loginBox")
      .classList
      .remove("hidden");


      document
      .getElementById("dashboard")
      .classList
      .add("hidden");

    }

  }
);
  /* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

  const ordersDiv =
    document.getElementById("orders");


  ordersDiv.innerHTML = `

    <div class="card empty">
      🔄 Checking owner authentication...
    </div>

  `;


  const currentUser =
    auth.currentUser;


  if(!currentUser){

    showDatabaseError({
      code:"auth/not-authenticated",
      message:"Owner is not authenticated."
    });

    return;

  }


  try{

    await currentUser.getIdToken(true);


    console.log(
      "Reading /orders as:",
      currentUser.email,
      currentUser.uid
    );


    /*
      Direct permission test.
    */

    const testSnapshot =
      await get(
        ref(db,"orders")
      );


    console.log(
      "Orders permission test successful."
    );


    /*
      Start realtime listener only once.
    */

    if(!ordersListenerStarted){

      ordersListenerStarted = true;


      onValue(

        ref(db,"orders"),

        snapshot => {

          renderOrders(snapshot);

        },

        error => {

          console.error(
            "Realtime orders listener error:",
            error
          );


          showDatabaseError(error);

        }

      );

    }

    else{

      renderOrders(
        testSnapshot
      );

    }

  }

  catch(error){

    console.error(
      "Could not read /orders:",
      error
    );


    showDatabaseError(
      error
    );

  }

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(
  snapshot
){

  const data =
    snapshot.val() || {};


  const ordersDiv =
    document.getElementById("orders");


  const orderIds =
    Object.keys(data).reverse();


  if(orderIds.length === 0){

    ordersDiv.innerHTML = `

      <div class="card empty">

        📭 No orders yet.

      </div>

    `;


    firstLoad = false;

    return;

  }


  let html = "";


  orderIds.forEach(
    orderId => {

      const order =
        data[orderId];


      html +=
        displayOrder(
          orderId,
          order
        );


      /*
        NEW ORDER SOUND
      */

      if(
        !firstLoad &&
        !knownOrderIds.has(orderId) &&
        order.status === "new"
      ){

        playOrderSound();

      }

    }
  );


  knownOrderIds =
    new Set(orderIds);


  firstLoad = false;


  ordersDiv.innerHTML =
    html;


  /*
    OPEN SPECIFIC ORDER
    when owner.html?order=ORDER_ID
  */

  if(requestedOrderId){

    const card =
      document.querySelector(
        '[data-order-id="' +
        CSS.escape(requestedOrderId) +
        '"]'
      );


    if(card){

      const note =
        document.createElement(
          "div"
        );


      note.className =
        "direct-order-title";


      note.textContent =
        "🔗 Direct order opened from WhatsApp";


      ordersDiv.prepend(
        note
      );


      setTimeout(
        () => {

          card.scrollIntoView({
            behavior:"smooth",
            block:"center"
          });

        },
        100
      );

    }

  }

}


/* =====================================================
   DATABASE ERROR
===================================================== */

function showDatabaseError(
  error
){

  const ordersDiv =
    document.getElementById("orders");


  const message =
    error &&
    error.message
    ?
    error.message
    :
    "Unknown Firebase error";


  const code =
    error &&
    error.code
    ?
    error.code
    :
    "unknown";


  ordersDiv.innerHTML = `

    <div class="error-box">

      <h2>
        ❌ Could not load orders
      </h2>

      <p>
        Firebase returned an error.
      </p>

      <p>
        <b>Error code:</b>
        ${escapeHTML(code)}
      </p>

      <p>
        <b>Message:</b>
        <br>
        ${escapeHTML(message)}
      </p>

      <button onclick="loadOrders()">
        🔄 Try Again
      </button>

    </div>

  `;

}


/* =====================================================
   RESUME ACTIVE DELIVERY
===================================================== */

async function resumeActiveDelivery(){

  const savedOrderId =
    localStorage.getItem(
      "farmFreshActiveDeliveryOrder"
    );


  if(
    !savedOrderId ||
    !navigator.geolocation
  ){

    return;

  }


  try{

    const snap =
      await get(
        ref(
          db,
          "orders/" +
          savedOrderId
        )
      );


    if(!snap.exists()){

      return;

    }


    const order =
      snap.val();


    if(
      order.status !==
      "out_for_delivery" ||
      order.trackingActive !== true
    ){

      return;

    }


    if(
      deliveryWatchId !== null
    ){

      navigator.geolocation
      .clearWatch(
        deliveryWatchId
      );

    }


    activeDeliveryOrderId =
      savedOrderId;


    deliveryWatchId =
      navigator.geolocation.watchPosition(

        async position => {

          if(
            activeDeliveryOrderId !==
            savedOrderId
          ){

            return;

          }


          await updateDeliveryLocation(
            savedOrderId,
            position
          );

        },

        error => {

          console.error(
            "GPS resume error:",
            error
          );

        },

        {
          enableHighAccuracy:true,
          maximumAge:5000,
          timeout:15000
        }

      );

  }

  catch(error){

    console.error(
      "Could not resume delivery tracking:",
      error
    );

  }

}


/* =====================================================
   DISPLAY ORDER
===================================================== */

function displayOrder(
  orderId,
  order
){

  let productsHTML = "";


  /*
    MULTI PRODUCT ORDER
  */

  if(
    Array.isArray(
      order.products
    )
  ){

    order.products.forEach(
      item => {

        productsHTML += `

          <div class="product">

            <b>
              ${escapeHTML(
                item.name
              )}
            </b>

            <br>

            ${escapeHTML(
              item.quantity
            )}
            ${escapeHTML(
              item.unit || "kg"
            )}

            × ₹${escapeHTML(
              item.price
            )}

            =

            <b>
              ₹${escapeHTML(
                item.subtotal
              )}
            </b>

          </div>

        `;

      }
    );

  }


  /*
    OLD SINGLE PRODUCT ORDER
  */

  else if(
    order.product
  ){

    productsHTML = `

      <div class="product">

        <b>
          ${escapeHTML(
            order.product
          )}
        </b>

        <br>

        Quantity:
        ${escapeHTML(
          order.quantity
        )}

      </div>

    `;

  }


  const status =
    order.status ||
    "new";


  let statusClass =
    "new";


  if(
    status === "accepted"
  ){

    statusClass =
      "accepted";

  }


  if(
    status === "out_for_delivery"
  ){

    statusClass =
      "out-for-delivery";

  }


  if(
    status === "rejected"
  ){

    statusClass =
      "rejected";

  }


  if(
    status === "delivered"
  ){

    statusClass =
      "delivered-status";

  }


  return `

    <div
      class="order ${
        requestedOrderId === orderId
        ?
        "direct-order"
        :
        ""
      }"
      data-order-id="${escapeAttribute(
        orderId
      )}"
    >

      <h3>
        🍗 Order
      </h3>


      <p class="small">

        Order ID:
        ${escapeHTML(
          orderId
        )}

      </p>


      <p>

        <b>👤 Customer:</b>
        <br>

        ${escapeHTML(
          order.name || ""
        )}

      </p>


      <p>

        <b>📱 Phone:</b>
        <br>

        ${escapeHTML(
          order.phone || ""
        )}

      </p>


      <p>

        <b>🚚 Delivery:</b>
        <br>

        ${escapeHTML(
          order.deliveryFor || ""
        )}

      </p>


      <h4>
        🛒 Products
      </h4>


      ${productsHTML}


      <h3>

        💰 Total:
        ₹${escapeHTML(
          order.total || 0
        )}

      </h3>


      <p>

        <b>📍 Address:</b>
        <br>

        ${escapeHTML(
          order.address ||
          "Not provided"
        )}

      </p>


      <p>

        <b>📏 Distance:</b>

        ${escapeHTML(
          order.distanceFromShop ||
          "-"
        )}

        km

      </p>


      <p
        class="status ${statusClass}"
      >

        Status:
        ${escapeHTML(
          status.toUpperCase()
        )}

      </p>


      ${
        order.trackingActive === true
        ?
        `

          <div class="tracking-box">

            <b>
              📡 Live Delivery Tracking Active
            </b>

            <br>

            <span class="small">
              Customer can currently track
              the delivery partner live.
            </span>

            <div class="location-sharing">

              📡 Your live GPS location
              is being shared with
              the customer.

            </div>

          </div>

        `
        :
        ""
      }


      <div>

        ${getActionButtons(
          orderId,
          order
        )}

      </div>


    </div>

  `;

}


/* =====================================================
   ACTION BUTTONS
===================================================== */

function getActionButtons(
  orderId,
  order
){

  if(
    order.status === "new"
  ){

    return `

      <button
        class="accept"
        onclick="updateStatus(
          '${escapeJs(orderId)}',
          'accepted'
        )"
      >

        ✅ Accept

      </button>


      <button
        class="reject"
        onclick="updateStatus(
          '${escapeJs(orderId)}',
          'rejected'
        )"
      >

        ❌ Reject

      </button>


      ${mapButtons(order)}

    `;

  }


  if(
    order.status === "accepted"
  ){

    return `

      <button
        class="delivery"
        onclick="startDelivery(
          '${escapeJs(orderId)}'
        )"
      >

        🚚 Start Delivery

      </button>


      ${mapButtons(order)}

    `;

  }


  if(
    order.status ===
    "out_for_delivery"
  ){

    return `

      ${
        order.trackingActive === true
        ?
        `

          <a
            class="btn track"
            href="${escapeAttribute(
              getTrackingLink(orderId)
            )}"
            target="_blank"
          >

            📍 Track Delivery

          </a>

        `
        :
        ""
      }


      <button
        class="delivered"
        onclick="markDelivered(
          '${escapeJs(orderId)}'
        )"
      >

        ✅ Mark Delivered

      </button>


      ${mapButtons(order)}

    `;

  }


  return mapButtons(order);

}


/* =====================================================
   START DELIVERY
===================================================== */

window.startDelivery =
async function(orderId){

  if(
    !navigator.geolocation
  ){

    alert(
      "❌ This browser does not support GPS location."
    );

    return;

  }


  if(
    deliveryWatchId !== null &&
    activeDeliveryOrderId !== orderId
  ){

    navigator.geolocation
    .clearWatch(
      deliveryWatchId
    );

    deliveryWatchId =
      null;

  }


  try{

    await new Promise(
      (resolve,reject) => {

        navigator.geolocation
        .getCurrentPosition(
          resolve,
          reject,
          {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
          }
        );

      }
    );


    const now =
      new Date().toISOString();


    /*
      PRIVATE ORDER
    */

    await update(
      ref(
        db,
        "orders/" +
        orderId
      ),
      {

        status:
          "out_for_delivery",

        trackingActive:
          true,

        deliveryStartedAt:
          now,

        deliveryLatitude:
          null,

        deliveryLongitude:
          null,

        deliveryAccuracy:
          null,

        deliveryUpdatedAt:
          null

      }
    );


    /*
      PUBLIC CUSTOMER TRACKING
    */

    await update(
      ref(
        db,
        "tracking/" +
        orderId
      ),
      {

        status:
          "out_for_delivery",

        trackingActive:
          true,

        deliveryLatitude:
          null,

        deliveryLongitude:
          null,

        deliveryAccuracy:
          null,

        deliveryUpdatedAt:
          null,

        deliveryStartedAt:
          now,

        updatedAt:
          now

      }
    );


    activeDeliveryOrderId =
      orderId;


    localStorage.setItem(
      "farmFreshActiveDeliveryOrder",
      orderId
    );


    deliveryWatchId =
      navigator.geolocation
      .watchPosition(

        async position => {

          if(
            activeDeliveryOrderId !==
            orderId
          ){

            return;

          }


          await updateDeliveryLocation(
            orderId,
            position
          );

        },

        error => {

          console.error(
            "GPS error:",
            error
          );


          alert(
            "⚠️ Delivery started, but live GPS could not be updated.\n\nPlease allow location permission."
          );

        },

        {
          enableHighAccuracy:true,
          maximumAge:5000,
          timeout:15000
        }

      );


    alert(
      "🚚 Delivery started.\n\n📍 Your live location is now being shared with the customer."
    );

  }

  catch(error){

    console.error(
      "Could not start delivery:",
      error
    );


    alert(
      "❌ Could not start live delivery tracking.\n\n" +
      error.message
    );

  }

};


/* =====================================================
   UPDATE DELIVERY LOCATION
===================================================== */

async function updateDeliveryLocation(
  orderId,
  position
){

  try{

    const latitude =
      position.coords.latitude;


    const longitude =
      position.coords.longitude;


    const accuracy =
      position.coords.accuracy;


    const updatedAt =
      new Date().toISOString();


    /*
      PRIVATE ORDER LOCATION
    */

    await update(
      ref(
        db,
        "orders/" +
        orderId
      ),
      {

        deliveryLatitude:
          latitude,

        deliveryLongitude:
          longitude,

        deliveryAccuracy:
          accuracy,

        deliveryUpdatedAt:
          updatedAt,

        trackingActive:
          true

      }
    );


    /*
      PUBLIC CUSTOMER TRACKING
    */

    await update(
      ref(
        db,
        "tracking/" +
        orderId
      ),
      {

        status:
          "out_for_delivery",

        trackingActive:
          true,

        deliveryLatitude:
          latitude,

        deliveryLongitude:
          longitude,

        deliveryAccuracy:
          accuracy,

        deliveryUpdatedAt:
          updatedAt,

        updatedAt:
          updatedAt

      }
    );


    console.log(
      "Live delivery location updated:",
      latitude,
      longitude
    );

  }

  catch(error){

    console.error(
      "Live location update failed:",
      error
    );

  }

}


/* =====================================================
   MARK DELIVERED
===================================================== */

window.markDelivered =
async function(orderId){

  const confirmDelivery =
    confirm(
      "Mark this order as DELIVERED?\n\nThis will also STOP live delivery location sharing."
    );


  if(
    !confirmDelivery
  ){

    return;

  }


  try{

    if(
      activeDeliveryOrderId ===
      orderId &&
      deliveryWatchId !== null
    ){

      navigator.geolocation
      .clearWatch(
        deliveryWatchId
      );

      deliveryWatchId =
        null;

      activeDeliveryOrderId =
        null;

    }


    if(
      localStorage.getItem(
        "farmFreshActiveDeliveryOrder"
      ) === orderId
    ){

      localStorage.removeItem(
        "farmFreshActiveDeliveryOrder"
      );

    }


    const stoppedAt =
      new Date().toISOString();


    /*
      PRIVATE ORDER
    */

    await update(
      ref(
        db,
        "orders/" +
        orderId
      ),
      {

        status:
          "delivered",

        trackingActive:
          false,

        deliveryLatitude:
          null,

        deliveryLongitude:
          null,

        deliveryAccuracy:
          null,

        deliveryUpdatedAt:
          null,

        deliveryStoppedAt:
          stoppedAt

      }
    );


    /*
      PUBLIC TRACKING
    */

    await update(
      ref(
        db,
        "tracking/" +
        orderId
      ),
      {

        status:
          "delivered",

        trackingActive:
          false,

        deliveryLatitude:
          null,

        deliveryLongitude:
          null,

        deliveryAccuracy:
          null,

        deliveryUpdatedAt:
          null,

        deliveryStoppedAt:
          stoppedAt,

        updatedAt:
          stoppedAt

      }
    );


    alert(
      "✅ Order marked as delivered.\n\n🛑 Live delivery location sharing has been stopped."
    );

  }

  catch(error){

    console.error(
      "Mark delivered error:",
      error
    );


    alert(
      "❌ Could not mark delivered:\n" +
      error.message
    );

  }

};

/* =====================================================
   ORDER SOUND
===================================================== */

let audioContext =
null;


window.enableSound =
function(){

  try{

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }


    playBeep();


    document
    .getElementById("soundStatus")
    .innerText =
      "🔊 Order sound enabled.";


    if(
      "Notification" in window &&
      Notification.permission ===
      "default"
    ){

      Notification.requestPermission();

    }

  }

  catch(error){

    console.error(
      error
    );


    document
    .getElementById("soundStatus")
    .innerText =
      "❌ Sound could not be enabled.";

  }

};


/* =====================================================
   BEEP
===================================================== */

function playBeep(){

  if(
    !audioContext
  ){

    return;

  }


  const oscillator =
    audioContext
    .createOscillator();


  const gain =
    audioContext
    .createGain();


  oscillator.type =
    "square";


  oscillator.frequency.value =
    1000;


  gain.gain.setValueAtTime(
    0.001,
    audioContext.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    0.9,
    audioContext.currentTime +
    0.03
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioContext.currentTime +
    0.6
  );


  oscillator.connect(
    gain
  );


  gain.connect(
    audioContext.destination
  );


  oscillator.start();


  oscillator.stop(
    audioContext.currentTime +
    0.6
  );

}


/* =====================================================
   NEW ORDER ALERT
===================================================== */

function playOrderSound(){

  if(
    audioContext
  ){

    playBeep();


    setTimeout(
      playBeep,
      500
    );


    setTimeout(
      playBeep,
      1000
    );

  }


  if(
    "Notification" in window &&
    Notification.permission ===
    "granted"
  ){

    new Notification(
      "🍗 New Chicken Order!",
      {
        body:
          "A new order has arrived."
      }
    );

  }

}
function stopOrderSound(){

  if(window.orderSoundInterval){

    clearInterval(
      window.orderSoundInterval
    );

    window.orderSoundInterval = null;

  }

}

/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttribute(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  );

}


function escapeJs(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /\\/g,
    "\\\\"
  )

  .replace(
    /'/g,
    "\\'"
  )

  .replace(
    /"/g,
    '\\"'
  )

  .replace(
    /\n/g,
    "\\n"
  )

  .replace(
    /\r/g,
    "\\r"
  );

}
