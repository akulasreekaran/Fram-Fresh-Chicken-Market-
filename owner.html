<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Farm Fresh - Owner</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#222;
  color:white;
  padding:18px;
  text-align:center;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.box{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 2px 10px #ddd;
}

input{
  width:100%;
  padding:12px;
  margin:7px 0;
  box-sizing:border-box;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  padding:12px 18px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.login{
  background:#d43d16;
  color:white;
  width:100%;
}

.sound{
  background:#222;
  color:white;
}

#dashboard{
  display:none;
}

#orders{
  margin-top:20px;
}

.order{
  background:white;
  padding:18px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #ddd;
}

.order h3{
  margin-top:0;
}

.status{
  font-weight:bold;
  margin:10px 0;
}

.actions button{
  margin:4px;
}

.accept{
  background:#168a3a;
  color:white;
}

.reject{
  background:#d62828;
  color:white;
}

.done{
  background:#1769aa;
  color:white;
}

.map{
  background:#555;
  color:white;
}

.call{
  background:#222;
  color:white;
}

</style>

</head>

<body>


<header>

<h2>🍗 Farm Fresh Owner</h2>

<p>Order Dashboard</p>

</header>


<div class="container">


<!-- LOGIN -->

<div id="loginBox" class="box">

<h2>🔐 Owner Login</h2>

<input
id="email"
type="email"
placeholder="Owner Email">

<input
id="password"
type="password"
placeholder="Password">

<button
class="login"
onclick="login()">

Login

</button>

<p id="loginStatus"></p>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

<div class="box">

<h2>📦 Orders</h2>

<button
class="sound"
onclick="enableSound()">

🔊 Enable Order Sound

</button>

<button
onclick="logout()">

Logout

</button>

</div>


<div id="orders"></div>

</div>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onChildAdded
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyCcKIDaVUTCzin0tP6oN16ABrexjGOS50M",

authDomain:
"farm-fresh-chicken-market.firebaseapp.com",

databaseURL:
"https://farm-fresh-chicken-market-default-rtdb.firebaseio.com",

projectId:
"farm-fresh-chicken-market",

storageBucket:
"farm-fresh-chicken-market.firebasestorage.app",

messagingSenderId:
"184530252526",

appId:
"1:184530252526:web:f7427c6a46eb76201df9ff"

};


const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const auth =
getAuth(app);


/* LOGIN */

window.login = async function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

document.getElementById(
"loginStatus"
).innerText =
"Login failed: " + error.message;

}

};


/* LOGOUT */

window.logout = function(){

signOut(auth);

};


/* CHECK LOGIN */

onAuthStateChanged(
auth,
user => {

if(user){

document.getElementById(
"loginBox"
).style.display="none";

document.getElementById(
"dashboard"
).style.display="block";

loadOrders();

}else{

document.getElementById(
"loginBox"
).style.display="block";

document.getElementById(
"dashboard"
).style.display="none";

}

});


/* LOAD ORDERS */

function loadOrders(){

const ordersRef =
ref(db,"orders");

onChildAdded(
ordersRef,
snapshot => {

const order =
snapshot.val();

displayOrder(
snapshot.key,
order
);

if(order.status === "new"){

playOrderSound();

}

});

}
  function displayOrder(id,order){

const div=document.createElement("div");

div.className="order";

div.id="order-"+id;


const status =
order.status || "new";


let buttons="";


if(status==="new"){

buttons=`

<button class="accept"
onclick="updateStatus('${id}','accepted')">
✅ Accept
</button>

<button class="reject"
onclick="updateStatus('${id}','rejected')">
❌ Reject
</button>

`;

}


if(status==="accepted"){

buttons=`

<button class="done"
onclick="updateStatus('${id}','delivered')">
🚚 Mark Delivered
</button>

`;

}


const mapLink =
order.customerMapLink ||
(
order.customerLatitude &&
order.customerLongitude
?
"https://www.google.com/maps?q="+
order.customerLatitude+","+
order.customerLongitude
:
"#"
);


const directionLink =
order.directionsLink ||
(
order.customerLatitude &&
order.customerLongitude
?
"https://www.google.com/maps/dir/?api=1"+
"&origin=17.470028,78.364139"+
"&destination="+
order.customerLatitude+","+
order.customerLongitude
:
mapLink
);


div.innerHTML=`

<h3>📦 New Order</h3>

<p>
<b>Name:</b>
${order.name || "-"}
</p>

<p>
<b>Phone:</b>
${order.phone || "-"}
</p>

<p>
<b>Product:</b>
${order.product || "-"}
</p>

<p>
<b>Quantity:</b>
${order.quantity || "-"}
</p>

<p>
<b>Delivery:</b>
${order.deliveryFor || "-"}
</p>

<p>
<b>Address:</b>
${order.address || "-"}
</p>

<p>
<b>Distance:</b>
${order.distanceFromShop || "-"} km
</p>

<p>
<b>Total:</b>
₹${order.total || 0}
</p>

<p class="status">
Status:
${status.toUpperCase()}
</p>

<div class="actions">

${buttons}

<a
class="btn map"
href="${mapLink}"
target="_blank">

📍 Customer Map

</a>

<a
class="btn map"
href="${directionLink}"
target="_blank">

🧭 Directions

</a>

<a
class="btn call"
href="tel:${order.phone || ""}">

📞 Call Customer

</a>

</div>

`;

document
.getElementById("orders")
.prepend(div);

}


/* UPDATE STATUS */

window.updateStatus =
async function(id,status){

try{

const {update,ref} =
await import(
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js"
);

await update(
ref(db,"orders/"+id),
{
status:status
}
);

const card =
document.getElementById(
"order-"+id
);

if(card){

const statusText =
card.querySelector(".status");

if(statusText){

statusText.innerText =
"Status: "+
status.toUpperCase();

}

const actions =
card.querySelector(".actions");

if(actions){

if(status==="accepted"){

actions.innerHTML=`

<button
class="done"
onclick="updateStatus('${id}','delivered')">

🚚 Mark Delivered

</button>

`;

}else{

actions.innerHTML=`

<b>
${status==="rejected"
?"❌ Order Rejected"
:"🚚 Order Delivered"}

</b>

`;

}

}

}

alert(
"Order status updated: "+
status
);

}catch(error){

alert(
"Could not update order: "+
error.message
);

}

};
  let audioContext;


/* ENABLE SOUND */

window.enableSound = function(){

try{

audioContext =
new (window.AudioContext ||
window.webkitAudioContext)();

audioContext.resume();

playBeep();

if("Notification" in window){

Notification.requestPermission();

}

alert("🔊 Order sound enabled!");

}catch(error){

alert("Sound could not be enabled.");

}

};


/* BEEP */

function playBeep(){

if(!audioContext) return;

const oscillator =
audioContext.createOscillator();

const gain =
audioContext.createGain();

oscillator.connect(gain);

gain.connect(audioContext.destination);

oscillator.frequency.value=800;

gain.gain.value=0.4;

oscillator.start();

setTimeout(()=>{

oscillator.stop();

},500);

}


/* NEW ORDER SOUND */

function playOrderSound(){

if(audioContext){

playBeep();

setTimeout(
playBeep,
700
);

setTimeout(
playBeep,
1400
);

}


/* NOTIFICATION */

if(
"Notification" in window &&
Notification.permission==="granted"
){

new Notification(
"🍗 New Chicken Order!",
{
body:"A new order has arrived."
}
);

}

}


</script>

</body>
</html>
