<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Farm Fresh Chicken Market - Owner</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 15px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 5px 3px;
    }

    .login-btn {
      width: 100%;
      background: #111;
      color: white;
    }

    .sound-btn {
      background: #ff9800;
      color: white;
      font-size: 16px;
    }

    .sound-on {
      background: #2e7d32;
    }

    .logout-btn {
      background: #d32f2f;
      color: white;
    }

    .done-btn {
      background: #2e7d32;
      color: white;
    }

    .order {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      background: #fff;
    }

    .new-order {
      border: 3px solid #ff9800;
      box-shadow: 0 0 15px rgba(255,152,0,0.3);
    }

    .status {
      font-weight: bold;
      color: #e65100;
    }

    .map-btn {
      background: #1976d2;
      color: white;
    }

    .call-btn {
      background: #00897b;
      color: white;
    }

    #dashboard {
      display: none;
    }

    #message {
      color: #d32f2f;
      margin-top: 10px;
    }

    .empty {
      text-align: center;
      color: #777;
    }

    .item {
      background: #f7f7f7;
      padding: 10px;
      margin: 6px 0;
      border-radius: 8px;
    }

    .new-badge {
      display: inline-block;
      background: #ff9800;
      color: white;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🐔 Farm Fresh Chicken Market</h1>
  <p>Owner Order Dashboard</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="box">

    <h2>Owner Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Owner Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button class="login-btn" onclick="login()">
      Login
    </button>

    <p id="message"></p>

  </div>
