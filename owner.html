<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Farm Fresh Chicken Market - Owner</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#222;
  color:white;
  padding:20px 15px;
  text-align:center;
}

header h2{
  margin:5px 0;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:15px;
  box-shadow:0 2px 10px #ddd;
}

input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

button,
.btn{
  padding:11px 15px;
  border:0;
  border-radius:8px;
  background:#d43d16;
  color:white;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  margin:4px;
}

.logout{
  background:#555;
}

.accept{
  background:#168a35;
}

.reject{
  background:#d62828;
}

.delivered{
  background:#1769aa;
}

.hidden{
  display:none;
}

.order{
  background:white;
  border:2px solid #eee;
  border-radius:12px;
  padding:15px;
  margin:15px 0;
}

.order h3{
  margin-top:0;
}

.product{
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.product:last-child{
  border-bottom:0;
}

.status{
  font-weight:bold;
  padding:8px 0;
}

.new{
  color:#d43d16;
}

.accepted{
  color:#168a35;
}

.rejected{
  color:#d62828;
}

.delivered-status{
  color:#1769aa;
}

.small{
  font-size:13px;
  color:#666;
}

.sound-box{
  background:#fff7e6;
  border-radius:10px;
  padding:12px;
  margin-top:10px;
}

#soundStatus{
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

</style>

</head>


<body>


<header>

<h2>🍗 Farm Fresh Chicken Market</h2>

<p>Owner Order Dashboard</p>

</header>


<div class="container">


<!-- =========================
     LOGIN
========================= -->

<div
  class="card"
  id="loginBox"
>

<h2>🔐 Owner Login</h2>

<input
  type="email"
  id="email"
  placeholder="Owner Email"
>

<input
  type="password"
  id="password"
  placeholder="Password"
>

<button onclick="login()">
Login
</button>

<p id="loginStatus"></p>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<div
  id="dashboard"
  class="hidden"
>


<div class="card">

<h2>📦 Orders</h2>

<div class="sound-box">

<button onclick="enableSound()">
🔊 Enable Order Sound
</button>

<p id="soundStatus">
🔕 Order sound is not enabled.
</p>

</div>

<button
  class="logout"
  onclick="logout()"
>
Logout
</button>

</div>


<div id="orders">

<p class="empty">
Loading orders...
</p>

</div>


</div>

</div>



<script type="module">


/* =========================
   FIREBASE
========================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getDatabase,
  ref,
  onValue,
  update
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyCcKIDaVUTCzin0tP6oN16ABrexjGOS50M",

  authDomain:
  "farm-fresh-chicken-market.firebaseapp.com",

  databaseURL:
  "https://farm-fresh-chicken-market-default-rtdb.firebaseio.com",

  projectId:
  "farm-fresh-chicken-market",

  storageBucket:
  "farm-fresh-chicken-market.firebasestorage.app",

  messagingSenderId:
  "184530252526",

  appId:
  "1:184530252526:web:f7427c6a46eb76201df9ff"

};


const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const auth =
getAuth(app);



/* =========================
   LOGIN
========================= */

window.login = async function(){

  const email =
    document
    .getElementById("email")
    .value
    .trim();

  const password =
    document
    .getElementById("password")
    .value;


  if(!email || !password){

    document
    .getElementById("loginStatus")
    .innerText =
    "❌ Enter email and password.";

    return;

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }
  catch(error){

    document
    .getElementById("loginStatus")
    .innerText =
    "❌ Login failed: " +
    error.message;

  }

};



/* =========================
   LOGOUT
========================= */

window.logout = async function(){

  await signOut(auth);

};



/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      document
      .getElementById("loginBox")
      .classList
      .add("hidden");


      document
      .getElementById("dashboard")
      .classList
      .remove("hidden");


      loadOrders();

    }
    else{

      document
      .getElementById("loginBox")
      .classList
      .remove("hidden");


      document
      .getElementById("dashboard")
      .classList
      .add("hidden");

    }

  }
);



/* =========================
   ORDER TRACKING
========================= */

let firstLoad = true;

let knownOrderIds =
new Set();



/* =========================
   LOAD ORDERS
========================= */

function loadOrders(){

  const ordersRef =
    ref(db,"orders");


  onValue(
    ordersRef,
    snapshot => {

      const data =
        snapshot.val() || {};


      const ordersDiv =
        document.getElementById("orders");


      const orderIds =
        Object.keys(data).reverse();


      if(orderIds.length === 0){

        ordersDiv.innerHTML = `

          <div class="card empty">

            📭 No orders yet.

          </div>

        `;

        firstLoad = false;

        return;

      }


      let html = "";


      orderIds.forEach(
        orderId => {

          const order =
            data[orderId];


          html +=
            displayOrder(
              orderId,
              order
            );


          /* NEW ORDER */

          if(
            !firstLoad &&
            !knownOrderIds.has(orderId) &&
            order.status === "new"
          ){

            playOrderSound();

          }

        }
      );


      knownOrderIds =
        new Set(orderIds);


      firstLoad = false;


      ordersDiv.innerHTML =
        html;

    }
  );

}



/* =========================
   DISPLAY ORDER
========================= */

function displayOrder(
  orderId,
  order
){

  let productsHTML = "";


  /* MULTI PRODUCT ORDER */

  if(
    Array.isArray(order.products)
  ){

    order.products.forEach(
      item => {

        productsHTML += `

          <div class="product">

            <b>
              ${escapeHTML(item.name)}
            </b>

            <br>

            ${item.quantity} kg
            × ₹${item.price}

            =

            <b>
              ₹${item.subtotal}
            </b>

          </div>

        `;

      }
    );

  }


  /* OLD SINGLE PRODUCT ORDER */

  else if(order.product){

    productsHTML = `

      <div class="product">

        <b>
          ${escapeHTML(order.product)}
        </b>

        <br>

        Quantity:
        ${escapeHTML(order.quantity)}

      </div>

    `;

  }


  const status =
    order.status || "new";


  let statusClass =
    "new";


  if(status === "accepted"){
    statusClass = "accepted";
  }

  if(status === "rejected"){
    statusClass = "rejected";
  }

  if(status === "delivered"){
    statusClass = "delivered-status";
  }


  return `

    <div class="order">

      <h3>
        🍗 Order
      </h3>


      <p class="small">

        Order ID:
        ${escapeHTML(orderId)}

      </p>


      <p>

        <b>👤 Customer:</b><br>

        ${escapeHTML(order.name || "")}

      </p>


      <p>

        <b>📱 Phone:</b><br>

        ${escapeHTML(order.phone || "")}

      </p>


      <p>

        <b>🚚 Delivery:</b><br>

        ${escapeHTML(
          order.deliveryFor || ""
        )}

      </p>


      <h4>
        🛒 Products
      </h4>


      ${productsHTML}


      <h3>

        💰 Total:
        ₹${escapeHTML(order.total || 0)}

      </h3>


      <p>

        <b>📍 Address:</b><br>

        ${escapeHTML(
          order.address ||
          "Not provided"
        )}

      </p>


      <p>

        <b>📏 Distance:</b>

        ${escapeHTML(
          order.distanceFromShop || "-"
        )}

        km

      </p>


      <p class="status ${statusClass}">

        Status:
        ${escapeHTML(
          status.toUpperCase()
        )}

      </p>


      <div>

        ${getActionButtons(
          orderId,
          order
        )}

      </div>


    </div>

  `;

}



/* =========================
   ACTION BUTTONS
========================= */

function getActionButtons(
  orderId,
  order
){

  if(order.status === "new"){

    return `

      <button
        class="accept"
        onclick="updateStatus(
          '${orderId}',
          'accepted'
        )"
      >

        ✅ Accept

      </button>


      <button
        class="reject"
        onclick="updateStatus(
          '${orderId}',
          'rejected'
        )"
      >

        ❌ Reject

      </button>


      ${mapButtons(order)}

    `;

  }


  if(order.status === "accepted"){

    return `

      <button
        class="delivered"
        onclick="updateStatus(
          '${orderId}',
          'delivered'
        )"
      >

        🚚 Mark Delivered

      </button>


      ${mapButtons(order)}

    `;

  }


  return mapButtons(order);

}



/* =========================
   MAP / DIRECTIONS / CALL
========================= */

function mapButtons(order){

  let html = "";


  if(order.customerMapLink){

    html += `

      <a
        class="btn"
        href="${escapeAttribute(
          order.customerMapLink
        )}"
        target="_blank"
      >

        📍 Customer Map

      </a>

    `;

  }


  if(order.directionsLink){

    html += `

      <a
        class="btn"
        href="${escapeAttribute(
          order.directionsLink
        )}"
        target="_blank"
      >

        🧭 Directions

      </a>

    `;

  }


  if(order.phone){

    html += `

      <a
        class="btn"
        href="tel:${escapeAttribute(
          order.phone
        )}"
      >

        📞 Call

      </a>

    `;

  }


  return html;

}



/* =========================
   UPDATE ORDER STATUS
========================= */

window.updateStatus =
async function(
  orderId,
  newStatus
){

  try{

    await update(
      ref(
        db,
        "orders/" + orderId
      ),
      {
        status:newStatus
      }
    );

  }
  catch(error){

    alert(
      "❌ Could not update order:\n" +
      error.message
    );

  }

};



/* =========================
   ORDER SOUND
========================= */

let audioContext = null;



/* ENABLE SOUND */

window.enableSound =
function(){

  try{

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }


    playBeep();


    document
    .getElementById("soundStatus")
    .innerText =
    "🔊 Order sound enabled.";


    if(
      "Notification" in window &&
      Notification.permission === "default"
    ){

      Notification.requestPermission();

    }

  }
  catch(error){

    document
    .getElementById("soundStatus")
    .innerText =
    "❌ Sound could not be enabled.";

  }

};



/* =========================
   BEEP
========================= */

function playBeep(){

  if(!audioContext) return;

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type = "square";

  oscillator.frequency.value = 1000;

  gain.gain.setValueAtTime(
    0.001,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.9,
    audioContext.currentTime + 0.03
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioContext.currentTime + 0.6
  );

  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + 0.6
  );

}


/* =========================
   NEW ORDER ALERT
========================= */

function playOrderSound(){

  if(audioContext){

    playBeep();


    setTimeout(
      playBeep,
      500
    );


    setTimeout(
      playBeep,
      1000
    );

  }


  if(
    "Notification" in window &&
    Notification.permission === "granted"
  ){

    new Notification(
      "🍗 New Chicken Order!",
      {
        body:
        "A new order has arrived."
      }
    );

  }

}



/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

  return String(value || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value){

  return String(value || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    );

}


</script>


</body>

</html>
