<body>


<header>

<h2>🍗 Farm Fresh Chicken Market</h2>

<p>Owner Order Dashboard</p>

</header>


<div class="container">


<!-- =========================
     LOGIN
========================= -->

<div
  class="card"
  id="loginBox"
>

<h2>🔐 Owner Login</h2>

<input
  type="email"
  id="email"

>

<input
  type="password"
  id="password"
  placeholder="Password"
>

<button onclick="login()">
Login
</button>

<p id="loginStatus"></p>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<div
  id="dashboard"
  class="hidden"
>


<div class="card">

<h2>📦 Orders</h2>

<div class="sound-box">

<button onclick="enableSound()">
🔊 Enable Order Sound
</button>

<p id="soundStatus">
🔕 Order sound is not enabled.
</p>

</div>

  class="logout"
  onclick="logout()"
>
Logout
</button>

</div>


<div id="orders">

<p class="empty">
Loading orders...
</p>

</div>


</div>

</div>



<script type="module">


/* =========================
   FIREBASE
========================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getDatabase,
  ref,
  onValue,
  get,
  update
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut,
  setPersistence,
  browserLocalPersistence
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyCcKIDaVUTCzin0tP6oN16ABrexjGOS50M",

  authDomain:
  "farm-fresh-chicken-market.firebaseapp.com",

  databaseURL:
  "https://farm-fresh-chicken-market-default-rtdb.firebaseio.com",

  projectId:
  "farm-fresh-chicken-market",

  storageBucket:
  "farm-fresh-chicken-market.firebasestorage.app",

  messagingSenderId:
  "184530252526",

  appId:
  "1:184530252526:web:f7427c6a46eb76201df9ff"

};


const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const auth =
getAuth(app);

setPersistence(auth, browserLocalPersistence).catch(error => {
  console.error("Auth persistence error:", error);
});



/* =========================
   LOGIN
========================= */

window.login = async function(){

  const email =
    document
    .getElementById("email")
    .value
    .trim();

  const password =
    document
    .getElementById("password")
    .value;


  if(!email || !password){

    document
    .getElementById("loginStatus")
    .innerText =
    "❌ Enter email and password.";

    return;

  }


  document.getElementById("loginStatus").innerText = "🔐 Signing in...";

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }
  catch(error){

    console.error("Owner login error:", error);

    let message = "❌ Login failed.";

    if(error.code === "auth/invalid-credential" || error.code === "auth/wrong-password" || error.code === "auth/user-not-found"){
      message = "❌ Email or password is incorrect.";
    }else if(error.code === "auth/invalid-email"){
      message = "❌ Please enter a valid owner email address.";
    }else if(error.code === "auth/too-many-requests"){
      message = "⚠️ Too many login attempts. Please wait a few minutes and try again.";
    }else if(error.code === "auth/operation-not-allowed"){
      message = "❌ Firebase Email/Password sign-in is not enabled.";
    }else if(error.code === "auth/network-request-failed"){
      message = "❌ Network error. Check your internet connection.";
    }else{
      message = "❌ Login failed: " + (error.message || error.code || "Unknown error");
    }

    document.getElementById("loginStatus").innerText = message;

  }

};



document.getElementById("password").addEventListener("keydown", event => {
  if(event.key === "Enter") window.login();
});


/* =========================
   LOGOUT
========================= */

window.logout = async function(){

  await signOut(auth);

};



/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      document
      .getElementById("loginBox")
      .classList
      .add("hidden");


      document
      .getElementById("dashboard")
      .classList
      .remove("hidden");


      loadOrders();

      resumeActiveDelivery();

    }
    else{

      document
      .getElementById("loginBox")
      .classList
      .remove("hidden");


      document
      .getElementById("dashboard")
      .classList
      .add("hidden");

    }

  }
);



/* =========================
   ORDER TRACKING
========================= */

let firstLoad = true;

let knownOrderIds =
new Set();

let deliveryWatchId = null;
let activeDeliveryOrderId = null;
const requestedOrderId = new URLSearchParams(window.location.search).get("order");



/* =========================
   LOAD ORDERS
========================= */


function loadOrders(){

  const ordersRef = ref(db, "orders");

  const ordersDiv = document.getElementById("orders");

  ordersDiv.innerHTML = `
    <div class="card empty">
      🔄 Connecting to Firebase orders...
    </div>
  `;

  onValue(
    ordersRef,

    snapshot => {

      console.log("Firebase orders snapshot received:", snapshot.val());

      const data = snapshot.val() || {};

      const orderIds = Object.keys(data).sort(
        (a,b) => {

          const timeA =
            data[a].createdAt
            ? new Date(data[a].createdAt).getTime()
            : 0;

          const timeB =
            data[b].createdAt
            ? new Date(data[b].createdAt).getTime()
            : 0;

          return timeB - timeA;
        }
      );


      if(orderIds.length === 0){

        ordersDiv.innerHTML = `
          <div class="card empty">
            📭 No orders found in Firebase.
          </div>
        `;

        firstLoad = false;
        return;
      }


      let html = "";


      orderIds.forEach(orderId => {

        const order = data[orderId];


        html += displayOrder(
          orderId,
          order
        );


        if(
          !firstLoad &&
          !knownOrderIds.has(orderId) &&
          order.status === "new"
        ){

          playOrderSound();

        }

      });


      knownOrderIds =
        new Set(orderIds);

      firstLoad = false;

      ordersDiv.innerHTML = html;


      if(requestedOrderId){

        const card =
          document.querySelector(
            '[data-order-id="' +
            CSS.escape(requestedOrderId) +
            '"]'
          );

        if(card){

          const note =
            document.createElement("div");

          note.className =
            "direct-order-title";

          note.textContent =
            "🔗 Direct order opened from WhatsApp";

          ordersDiv.prepend(note);

          setTimeout(
            () => card.scrollIntoView({
              behavior:"smooth",
              block:"center"
            }),
            100
          );

        }

      }

    },

    error => {

      console.error(
        "Firebase orders error:",
        error
      );


      ordersDiv.innerHTML = `

        <div class="card"
             style="
               border:2px solid #d62828;
               background:#fff0f0;
             ">

          <h3>
            ❌ Could not load orders
          </h3>

          <p>
            Firebase returned an error.
          </p>

          <p>
            <b>Error:</b>
            ${escapeHTML(
              error.message ||
              error.code ||
              "Unknown Firebase error"
            )}
          </p>

          <p class="small">
            Check Firebase Realtime Database Rules
            and make sure the owner is logged in.
          </p>

        </div>

      `;

    }

  );

}


async function resumeActiveDelivery(){

  const savedOrderId = localStorage.getItem("farmFreshActiveDeliveryOrder");
  if(!savedOrderId || !navigator.geolocation) return;

  try{
    const snap = await get(ref(db,"orders/" + savedOrderId));
    if(!snap.exists()) return;
    const order = snap.val();
    if(order.status !== "out_for_delivery" || order.trackingActive !== true) return;

    if(deliveryWatchId !== null) navigator.geolocation.clearWatch(deliveryWatchId);
    activeDeliveryOrderId = savedOrderId;
    deliveryWatchId = navigator.geolocation.watchPosition(
      async position => {
        if(activeDeliveryOrderId !== savedOrderId) return;
        try{
          await update(ref(db,"orders/" + savedOrderId),{
            deliveryLatitude:position.coords.latitude,
            deliveryLongitude:position.coords.longitude,
            deliveryAccuracy:position.coords.accuracy,
            deliveryUpdatedAt:new Date().toISOString(),
            trackingActive:true
          });
        }catch(e){ console.error(e); }
      },
      error => console.error("GPS resume error:",error),
      {enableHighAccuracy:true,maximumAge:5000,timeout:15000}
    );
  }catch(e){ console.error("Could not resume delivery tracking:",e); }
}

/* =========================
   DISPLAY ORDER
========================= */

function displayOrder(
  orderId,
  order
){

  let productsHTML = "";


  /* MULTI PRODUCT ORDER */

  if(
    Array.isArray(order.products)
  ){

    order.products.forEach(
      item => {

        productsHTML += `

          <div class="product">

            <b>
              ${escapeHTML(item.name)}
            </b>

            <br>

            ${item.quantity} ${item.unit || "kg"}
            × ₹${item.price}

            =

            <b>
              ₹${item.subtotal}
            </b>

          </div>

        `;

      }
    );

  }


  /* OLD SINGLE PRODUCT ORDER */

  else if(order.product){

    productsHTML = `

      <div class="product">

        <b>
          ${escapeHTML(order.product)}
        </b>

        <br>

        Quantity:
        ${escapeHTML(order.quantity)}

      </div>

    `;

  }


  const status =
    order.status || "new";


  let statusClass =
    "new";


  if(status === "accepted"){
    statusClass = "accepted";
  }

  if(status === "out_for_delivery"){
    statusClass = "out-for-delivery";
  }

  if(status === "rejected"){
    statusClass = "rejected";
  }

  if(status === "delivered"){
    statusClass = "delivered-status";
  }


  return `

    <div class="order ${requestedOrderId === orderId ? "direct-order" : ""}" data-order-id="${escapeAttribute(orderId)}">

      <h3>
        🍗 Order
      </h3>


      <p class="small">

        Order ID:
        ${escapeHTML(orderId)}

      </p>


      <p>

        <b>👤 Customer:</b><br>

        ${escapeHTML(order.name || "")}

      </p>


      <p>

        <b>📱 Phone:</b><br>

        ${escapeHTML(order.phone || "")}

      </p>


      <p>

        <b>🚚 Delivery:</b><br>

        ${escapeHTML(
          order.deliveryFor || ""
        )}

      </p>


      <h4>
        🛒 Products
      </h4>


      ${productsHTML}


      <h3>

        💰 Total:
        ₹${escapeHTML(order.total || 0)}

      </h3>


      <p>

        <b>📍 Address:</b><br>

        ${escapeHTML(
          order.address ||
          "Not provided"
        )}

      </p>


      <p>

        <b>📏 Distance:</b>

        ${escapeHTML(
          order.distanceFromShop || "-"
        )}

        km

      </p>


      <p class="status ${statusClass}">

        Status:
        ${escapeHTML(
          status.toUpperCase()
        )}

      </p>


      ${
        order.trackingActive === true
        ?
        `
        <div class="tracking-box">

          <b>📡 Live Delivery Tracking Active</b>

          <br>

          <span class="small">
            Customer can currently track the delivery partner live.
          </span>

          <div class="location-sharing">
            📡 Your live GPS location is being shared with the customer.
          </div>

        </div>
        `
        :
        ""
      }


      <div>

        ${getActionButtons(
          orderId,
          order
        )}

      </div>


    </div>

  `;

}



/* =========================
   ACTION BUTTONS
========================= */

function getActionButtons(
  orderId,
  order
){

  if(order.status === "new"){

    return `

      <button
        class="accept"
        onclick="updateStatus(
          '${orderId}',
          'accepted'
        )"
      >

        ✅ Accept

      </button>


      <button
        class="reject"
        onclick="updateStatus(
          '${orderId}',
          'rejected'
        )"
      >

        ❌ Reject

      </button>


      ${mapButtons(order)}

    `;

  }


  if(order.status === "accepted"){

    return `

      <button
        class="delivery"
        onclick="startDelivery(
          '${orderId}'
        )"
      >

        🚚 Start Delivery

      </button>


      ${mapButtons(order)}

    `;

  }


  if(order.status === "out_for_delivery"){

    return `

      ${
        order.trackingActive === true
        ?
        `
        <a
          class="btn track"
          href="${escapeAttribute(
            getTrackingLink(orderId)
          )}"
          target="_blank"
        >

          📍 Track Delivery

        </a>
        `
        :
        ""
      }


      <button
        class="delivered"
        onclick="markDelivered(
          '${orderId}'
        )"
      >

        ✅ Mark Delivered

      </button>


      ${mapButtons(order)}

    `;

  }


  return mapButtons(order);

}



/* =========================
   START DELIVERY
========================= */

window.startDelivery =
async function(orderId){

  if(!navigator.geolocation){
    alert("❌ This browser does not support GPS location.");
    return;
  }

  if(deliveryWatchId !== null && activeDeliveryOrderId !== orderId){
    navigator.geolocation.clearWatch(deliveryWatchId);
    deliveryWatchId = null;
  }

  try{
    await new Promise((resolve,reject)=>{
      navigator.geolocation.getCurrentPosition(resolve,reject,{
        enableHighAccuracy:true,
        timeout:15000,
        maximumAge:0
      });
    });

    await update(
      ref(db,"orders/" + orderId),
      {
        status:"out_for_delivery",
        trackingActive:true,
        deliveryStartedAt:new Date().toISOString(),
        deliveryLatitude:null,
        deliveryLongitude:null,
        deliveryAccuracy:null,
        deliveryUpdatedAt:null
      }
    );

    activeDeliveryOrderId = orderId;
    localStorage.setItem("farmFreshActiveDeliveryOrder", orderId);

    deliveryWatchId = navigator.geolocation.watchPosition(
      async position => {
        if(activeDeliveryOrderId !== orderId) return;

        try{
          await update(
            ref(db,"orders/" + orderId),
            {
              deliveryLatitude:position.coords.latitude,
              deliveryLongitude:position.coords.longitude,
              deliveryAccuracy:position.coords.accuracy,
              deliveryUpdatedAt:new Date().toISOString(),
              trackingActive:true
            }
          );
        }catch(error){
          console.error("Live location update failed:",error);
        }
      },
      error => {
        console.error("GPS error:",error);
        alert("⚠️ Delivery started, but live GPS could not be updated. Please allow location permission.");
      },
      {enableHighAccuracy:true,maximumAge:5000,timeout:15000}
    );

    alert("🚚 Delivery started.\n\n📍 Your live location is now being shared with the customer.");

  }catch(error){
    alert("❌ Could not start live delivery tracking.\n\nPlease allow location permission and try again.");
  }

};



/* =========================
   MARK DELIVERED
========================= */

window.markDelivered =
async function(orderId){

  const confirmDelivery = confirm(
    "Mark this order as DELIVERED?\n\nThis will also STOP live delivery location sharing."
  );

  if(!confirmDelivery) return;

  try{
    if(activeDeliveryOrderId === orderId && deliveryWatchId !== null){
      navigator.geolocation.clearWatch(deliveryWatchId);
      deliveryWatchId = null;
      activeDeliveryOrderId = null;
    }

    if(localStorage.getItem("farmFreshActiveDeliveryOrder") === orderId){
      localStorage.removeItem("farmFreshActiveDeliveryOrder");
    }

    await update(
      ref(db,"orders/" + orderId),
      {
        status:"delivered",
        trackingActive:false,
        deliveryLatitude:null,
        deliveryLongitude:null,
        deliveryAccuracy:null,
        deliveryUpdatedAt:null,
        deliveryStoppedAt:new Date().toISOString()
      }
    );

    alert("✅ Order marked as delivered.\n\n🛑 Live delivery location sharing has been stopped.");

  }catch(error){
    alert("❌ Could not mark delivered:\n" + error.message);
  }

};



/* =========================
   NORMAL STATUS UPDATE
========================= */

window.updateStatus =
async function(
  orderId,
  newStatus
){

  try{

    await update(
      ref(
        db,
        "orders/" + orderId
      ),
      {
        status:newStatus
      }
    );

  }
  catch(error){

    alert(
      "❌ Could not update order:\n" +
      error.message
    );

  }

};



/* =========================
   CUSTOMER TRACKING LINK
========================= */

function getTrackingLink(orderId){

  return (
    "https://akulasreekaran.github.io/" +
    "Fram-Fresh-Chicken-Market-/" +
    "track.html?order=" +
    encodeURIComponent(orderId)
  );

}



/* =========================
   MAP / DIRECTIONS / CALL
========================= */

function mapButtons(order){

  let html = "";


  if(order.customerMapLink){

    html += `

      <a
        class="btn"
        href="${escapeAttribute(
          order.customerMapLink
        )}"
        target="_blank"
      >

        📍 Customer Map

      </a>

    `;

  }


  if(order.directionsLink){

    html += `

      <a
        class="btn"
        href="${escapeAttribute(
          order.directionsLink
        )}"
        target="_blank"
      >

        🧭 Directions

      </a>

    `;

  }


  if(order.phone){

    html += `

      <a
        class="btn"
        href="tel:${escapeAttribute(
          order.phone
        )}"
      >

        📞 Call

      </a>

    `;

  }


  return html;

}



/* =========================
   ORDER SOUND
========================= */

let audioContext = null;



/* ENABLE SOUND */

window.enableSound =
function(){

  try{

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }


    playBeep();


    document
    .getElementById("soundStatus")
    .innerText =
    "🔊 Order sound enabled.";


    if(
      "Notification" in window &&
      Notification.permission === "default"
    ){

      Notification.requestPermission();

    }

  }
  catch(error){

    document
    .getElementById("soundStatus")
    .innerText =
  "❌ Sound could not be enabled.";

  }

};



/* =========================
   BEEP
========================= */

function playBeep(){

  if(!audioContext) return;

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type = "square";

  oscillator.frequency.value = 1000;

  gain.gain.setValueAtTime(
    0.001,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.9,
    audioContext.currentTime + 0.03
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioContext.currentTime + 0.6
  );

  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + 0.6
  );

}



/* =========================
   NEW ORDER ALERT
========================= */

function playOrderSound(){

  if(audioContext){

    playBeep();

    setTimeout(
      playBeep,
      500
    );

    setTimeout(
      playBeep,
      1000
    );

  }


  if(
    "Notification" in window &&
    Notification.permission === "granted"
  ){

    new Notification(
      "🍗 New Chicken Order!",
      {
        body:
        "A new order has arrived."
      }
    );

  }

}



/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

  return String(value || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value){

  return String(value || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    );

}


</script>
