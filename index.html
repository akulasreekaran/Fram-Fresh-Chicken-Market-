<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Farm Fresh Chicken Market</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fff;
      color: #222;
    }

    header {
      background: #d71920;
      color: white;
      padding: 15px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
      font-weight: bold;
    }

    .hero {
      background:
        linear-gradient(
          rgba(0,0,0,0.45),
          rgba(0,0,0,0.45)
        ),
        url("images/4811bcd4c11d9bffbd6b0453c955913c.png");

      background-size: cover;
      background-position: center;
      min-height: 420px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      color: white;
      padding: 30px;
    }

    .hero h2 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      background: #d71920;
      color: white;
      padding: 13px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      background: #b9141a;
    }

    section {
      padding: 45px 20px;
      max-width: 1100px;
      margin: auto;
    }

    section h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #d71920;
      font-size: 30px;
    }

    /* SHOP PHOTOS */

    .gallery {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));

      gap: 15px;
    }

    .gallery img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.15);
    }

    /* PRODUCTS */

    .products {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

      gap: 20px;
    }

    .product {
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
      background: white;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.08);

      text-align: center;
      padding-bottom: 20px;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .product h3 {
      margin: 15px 0 8px;
      font-size: 20px;
    }

    .product p {
      color: #d71920;
      font-size: 18px;
      font-weight: bold;
    }

    /* ORDER */

    .order-box {
      max-width: 600px;
      margin: auto;
      background: #f7f7f7;
      padding: 25px;
      border-radius: 15px;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.1);
    }

    .order-box input,
    .order-box select {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;

      border: 1px solid #ccc;
      border-radius: 7px;

      font-size: 16px;
    }

    .order-box button {
      width: 100%;
      font-size: 17px;
    }

    #locationStatus {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 7px;

      background: #fff3cd;
      color: #664d03;

      display: none;
    }

      text-align: center;
      background: #f7f7
